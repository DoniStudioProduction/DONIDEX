name: DONIDEX Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Google Play API 36
        working-directory: android
        run: |
          echo 'Capacitor Android SDK configuration before release gate:'
          grep -E 'compileSdkVersion|targetSdkVersion' variables.gradle || true
          sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle
          sed -i -E 's/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' variables.gradle
          echo 'Capacitor Android SDK configuration after API 36 enforcement:'
          grep -E 'compileSdkVersion|targetSdkVersion' variables.gradle
      - name: Verify Google Play API 36 target
        working-directory: android
        run: |
          echo 'Generated Android SDK configuration:'
          grep -E 'compileSdk|targetSdk' app/build.gradle || true
          grep -E 'compileSdkVersion[[:space:]]*=[[:space:]]*36' variables.gradle
          grep -E 'targetSdkVersion[[:space:]]*=[[:space:]]*36' variables.gradle
          echo 'PASS: Android compileSdkVersion 36 and targetSdkVersion 36 verified.'
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: donidex-android-release
          path: android/app/build/outputs/bundle/release/*.aab
