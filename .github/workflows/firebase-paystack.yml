name: Deploy secure Paystack backend

on:
  workflow_dispatch:

jobs:
  deploy-paystack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Store Paystack secret in Firebase Secret Manager
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          test -n "$PAYSTACK_SECRET_KEY"
          printf '%s' "$PAYSTACK_SECRET_KEY" | firebase functions:secrets:set PAYSTACK_SECRET_KEY --project "$FIREBASE_PROJECT_ID" --data-file=-

      - name: Deploy Paystack function
        run: firebase deploy --only functions:paystackBilling --project "$FIREBASE_PROJECT_ID"
