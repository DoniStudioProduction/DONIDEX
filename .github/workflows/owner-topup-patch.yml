name: Apply owner top-up recovery patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-topup-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DONIDEX owner recovery UI and auth indexing
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace("import { BarChart3, Building2, ChevronDown, CreditCard, FilePlus2, FileText, LayoutDashboard, LogIn, MoreHorizontal, Plus, ReceiptText, Settings2, ShieldCheck, Trash2, UserCircle2, Users, WalletCards, X } from 'lucide-react';", "import { BarChart3, Building2, ChevronDown, CreditCard, FilePlus2, FileText, LayoutDashboard, LogIn, MoreHorizontal, Plus, ReceiptText, Settings2, ShieldCheck, Trash2, UserCircle2, Users, WalletCards, X } from 'lucide-react';\nimport { auth } from './lib/firebase';\nimport OwnerTopUp from './OwnerTopUp';")
          s = s.replace("const [modal, setModal] = useState<'profile'|'settings'|'security'|'plans'|null>(null);", "const [modal, setModal] = useState<'profile'|'settings'|'security'|'plans'|'ownerTopUp'|null>(null);")
          menu = "<button onClick={() => { setModal('plans'); setMenuOpen(false); }}><CreditCard size={15}/> Plans & Billing</button>"
          replacement = menu + "{auth?.currentUser?.email?.toLowerCase() === 'donistudioproduction@gmail.com' && <button onClick={() => { setModal('ownerTopUp'); setMenuOpen(false); }}><ShieldCheck size={15}/> Owner Top-Up</button>}"
          if menu in s and "Owner Top-Up" not in s:
              s = s.replace(menu, replacement, 1)
          heading = "{modal === 'profile' ? 'User Profile' : modal === 'settings' ? 'Business Settings' : modal === 'security' ? 'Security & Account' : 'Plans & Billing'}"
          s = s.replace(heading, "{modal === 'profile' ? 'User Profile' : modal === 'settings' ? 'Business Settings' : modal === 'security' ? 'Security & Account' : modal === 'ownerTopUp' ? 'Owner Top-Up' : 'Plans & Billing'}", 1)
          end = "</div>;\n}"
          if "<OwnerTopUp onClose" not in s:
              idx = s.rfind(end)
              if idx == -1: raise SystemExit('App.tsx return footer not found')
              insert = "</div>{modal === 'ownerTopUp' && <OwnerTopUp onClose={() => setModal(null)} />}\n}"
              s = s[:idx] + insert + s[idx+len(end):]
          app.write_text(s)

          css = Path('src/index.css')
          c = css.read_text()
          if '.owner-topup-backdrop' not in c:
              c += "\n\n.owner-topup-backdrop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.76);display:grid;place-items:center;padding:16px;overflow:auto}.owner-topup-modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0d0d0d;border:1px solid #4b3a16;border-radius:22px;padding:20px;box-shadow:0 28px 90px rgba(0,0,0,.65)}.owner-warning{margin:14px 0;padding:12px 14px;border:1px solid #4b3a16;background:#17130a;color:#e9dcae;border-radius:12px;line-height:1.45}.owner-search{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.owner-search label,.owner-form-grid label,.owner-topup-modal>label{display:grid;gap:6px;color:#cfcfcf;font-size:13px}.owner-search input,.owner-form-grid input,.owner-form-grid select,.owner-topup-modal textarea{width:100%;box-sizing:border-box;border:1px solid #37322a;background:#090909;color:#fff;border-radius:12px;padding:12px;outline:none}.owner-results{display:grid;gap:8px;margin:12px 0}.owner-result{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;padding:12px;border-radius:12px;border:1px solid #29241b;background:#111;color:#fff;cursor:pointer}.owner-result.selected{border-color:#d4af37;box-shadow:0 0 0 1px rgba(212,175,55,.18)}.owner-result div{display:grid;gap:3px}.owner-result span,.owner-result small,.owner-selected span,.owner-selected small{color:#999}.owner-selected{display:grid;gap:4px;padding:12px;margin:12px 0;border:1px solid #3e3217;background:#15120b;border-radius:12px}.owner-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}.owner-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.owner-message{margin-top:12px;padding:11px 13px;border-radius:12px;background:#17130a;border:1px solid #4b3a16;color:#eadca9}.owner-topup-modal .primary,.owner-topup-modal .secondary{min-height:42px}@media(max-width:640px){.owner-search,.owner-form-grid{grid-template-columns:1fr}.owner-actions{flex-direction:column}.owner-actions button{width:100%}}\n"
              css.write_text(c)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/AuthGate.tsx')
          s=p.read_text()
          s=s.replace("import { appleProvider, auth, firebaseConfigured, googleProvider } from './lib/firebase';", "import { doc, setDoc } from 'firebase/firestore';\nimport { appleProvider, auth, db, firebaseConfigured, googleProvider } from './lib/firebase';")
          old="useEffect(() => { if (!auth) { setReady(true); return; } return onAuthStateChanged(auth, value => { setUser(value); setReady(true); }); }, []);"
          new="useEffect(() => { if (!auth) { setReady(true); return; } return onAuthStateChanged(auth, value => { setUser(value); setReady(true); if (value?.emailVerified && db) void setDoc(doc(db, 'userProfiles', value.uid), { uid: value.uid, email: value.email?.toLowerCase() || '', displayName: value.displayName || '', photoURL: value.photoURL || null, providers: value.providerData.map(profile => profile.providerId), updatedAt: new Date().toISOString() }, { merge: true }); }); }, []);"
          if old not in s: raise SystemExit('AuthGate listener pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/AuthGate.tsx src/index.css
          git diff --cached --quiet && exit 0
          git commit -m 'Build owner subscription recovery console'
          git push
