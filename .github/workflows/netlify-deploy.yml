name: Deploy DONIDEX to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx netlify-cli deploy --prod --dir=dist --functions=netlify/functions --site=076a69a0-acf4-4dde-b686-2b0bad66e7b9 --message "DONIDEX main ${GITHUB_SHA}"
